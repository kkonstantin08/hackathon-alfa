name: CI

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  foundation:
    name: foundation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Foundation tests
        run: python3 -m unittest discover -s tests -p 'test_validate_scaffold.py' -v
      - name: Scaffold and PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/validate_scaffold.py --root . --pr-title "$PR_TITLE"
  application:
    name: application
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      LLM_MODE: mock
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.11.32'
      - name: Install locked dependencies
        run: uv sync --frozen --python 3.12
      - name: Lint
        run: uv run ruff check app contracts eval tests
      - name: Application, contract and foundation tests
        run: uv run pytest
