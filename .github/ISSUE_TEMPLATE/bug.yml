name: Ошибка
description: Один результат, пять критериев и независимое ревью
title: "fix: "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Результат, границы и воспроизведение
      description: Один проверяемый результат, ориентир 1–3 часа.
    validations:
      required: true
  - type: textarea
    id: owners
    attributes:
      label: Основной исполнитель, помощь и ревьюер
      description: Александр / Константин / Алексей / Тимофей. Второй исполнитель при необходимости только Алексей; независимый ревьюер не соавтор.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Пять acceptance criteria
      description: Пять отдельных проверяемых условий с доказательствами.
      value: |
        - [ ] AC1:
        - [ ] AC2:
        - [ ] AC3:
        - [ ] AC4:
        - [ ] AC5:
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Входы, контракты и зависимости
      description: Ссылки на Issues, производители и потребители интерфейсов.
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Проверка и передача
      description: Команды, сценарий, mock/live, ожидаемые результаты и ограничения; без секретов.
    validations:
      required: true
