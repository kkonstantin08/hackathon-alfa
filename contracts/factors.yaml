# Словарь факторов — общий язык профилей и новостей.
# Новость размечается ТОЛЬКО факторами отсюда; профиль получает экспозиции ТОЛЬКО по этим id.
# sectors — префиксы ОКВЭД отраслевых факторов (для мока и затухания «не ваша отрасль»).
# keywords — для мок-разметчика и BM25-буста; в live-режиме разметку делает Gemma по name+hint.
# Черновик. Финальный список фиксируется в первые 3 часа дня 1.
version: 1
factors:
  - id: key_rate
    name: Ключевая ставка и стоимость денег
    hint: решения ЦБ, ДКП, ставки по кредитам и депозитам, ОФЗ
    keywords: [ключев, ставк, цб, банк росси, дкп, монетарн, кредитн, офз, доходност]
  - id: inflation
    name: Инфляция
    hint: рост цен, инфляционные ожидания, ИПЦ
    keywords: [инфляц, ипц, рост цен, подорожа]
  - id: fx_usd
    name: Курс доллара и евро
    hint: курс рубля к доллару и евро
    keywords: [доллар, евро, курс рубл, валютн]
  - id: fx_cny
    name: Курс юаня
    hint: курс рубля к юаню, расчёты в юанях
    keywords: [юан, cny, китайск валют]
  - id: oil_gas
    name: Нефть и газ
    hint: цены на нефть, газ, нефтепродукты, экспорт энергоносителей
    sectors: ["06", "19", "49", "35"]
    keywords: [нефт, brent, urals, газ, топлив, бензин, дизел]
  - id: metals
    name: Металлы
    hint: цены на сталь, цветные и драгоценные металлы
    sectors: ["24", "07", "25"]
    keywords: [сталь, стальн, металл, алюмини, медь, никел, золот, прокат]
  - id: grain_agri
    name: Зерно и агросектор
    hint: урожай, цены на зерно, экспортные пошлины и квоты
    sectors: ["01", "46.21", "10.6", "10.7"]
    keywords: [зерн, пшениц, урожа, агро, сельхоз, пошлин на зерн]
  - id: food_prices
    name: Продовольствие
    hint: цены на продукты, переработка, торговые сети
    sectors: ["10", "46.3", "47.1", "47.2"]
    keywords: [продовольств, продукт питан, молок, мяс, сахар]
  - id: sanctions_trade
    name: Санкции и ограничения торговли
    hint: санкции, вторичные санкции, ограничения платежей, параллельный импорт
    keywords: [санкц, ограничен, эмбарго, параллельн импорт, платеж за рубеж]
  - id: customs_fx_control
    name: Таможня и валютный контроль
    hint: пошлины, таможенные правила, валютный контроль, ВЭД
    keywords: [пошлин, таможен, вэд, валютн контрол, импорт, экспорт]
  - id: logistics
    name: Логистика
    hint: перевозки, ставки фрахта, ж/д, порты, сроки доставки
    sectors: ["49", "50", "51", "52", "53"]
    keywords: [логист, перевоз, фрахт, ржд, порт, контейнер, грузоперевоз]
  - id: taxes
    name: Налоги
    hint: налоговые изменения, НДС, налог на прибыль, льготы
    keywords: [налог, ндс, фнс, налогов]
  - id: labor_market
    name: Рынок труда
    hint: дефицит кадров, зарплаты, безработица, мигранты
    keywords: [зарплат, кадр, рынок труда, безработиц, персонал]
  - id: consumer_demand
    name: Потребительский спрос
    hint: розничные продажи, потребление, кредитование физлиц
    keywords: [потреблен, розничн, спрос, продаж, потребител]
  - id: construction_realty
    name: Стройка и недвижимость
    hint: ипотека, ввод жилья, стройматериалы, девелоперы
    sectors: ["41", "42", "43", "23", "68"]
    keywords: [ипотек, строител, девелоп, жиль, недвижим]
  - id: it_tech
    name: IT и технологии
    hint: льготы IT, импортозамещение ПО, оборудование
    sectors: ["62", "63"]
    keywords: [it, ит-, программн, софт, импортозамещ, цифров]
  - id: regulation
    name: Регулирование отрасли
    hint: новые требования, лицензии, маркировка, отраслевые законы
    keywords: [закон, регулир, маркировк, лиценз, требован, госдум]
  - id: state_support
    name: Господдержка
    hint: субсидии, льготные кредиты, госпрограммы, госзаказ
    keywords: [субсид, льготн, господдерж, госпрограм, госзаказ]
  - id: regional_economy
    name: Экономика региона
    hint: события в конкретном регионе
    keywords: [регион, област, край, республик]
  - id: credit_market
    name: Кредитный рынок для бизнеса
    hint: доступность кредитов, лизинг, факторинг, требования банков
    keywords: [лизинг, факторинг, кредитован бизнес, корпоративн кредит]
